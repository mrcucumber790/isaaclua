# Language mods see as Options.Language (en, ru, jp, kr, zh, de, fr, es, ...).
# Default: the game's language. EID follows it: language = ru gives Russian descriptions.
# language = ru

# Size of Mod Config Menu (laid out for PC's 480x270; default: shrunk to fit the Switch's screen, 0.84).
# menu_scale = 0.9

