name: Проблема / Bug report
description: Игра вылетает, мод не работает, ошибка на экране / Crash, a mod does not work, an error on screen
title: "[1.0.x] <мод>: <что случилось>"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо! Чем больше файлов приложишь, тем быстрее найдётся причина. Файлы можно перетащить прямо в поля ниже (zip тоже можно).
        Thanks! Attach as many of the files below as you can; drag them into the fields (zip is fine). English is fine too.
  - type: input
    id: version
    attributes:
      label: Версия isaaclua / isaaclua version
      description: Строка вверху экрана в забеге, например `isaaclua v1.0.0 (Lua 5.3.6), 12 mod(s) loaded` / the line at the top of the screen in a run
      placeholder: isaaclua v1.0.0, 12 mod(s) loaded
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Прошивка Switch и Atmosphere / Switch firmware and Atmosphere
      placeholder: "FW 19.0.1, Atmosphere 1.8.0"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Что случилось / What happened
      options:
        - Игра вылетает (ошибка Atmosphere / чёрный экран) / The game crashes
        - Игра зависает / The game hangs
        - Ошибка красным вверху экрана / A red error at the top of the screen
        - Мод работает не так, как на ПК / A mod behaves differently from PC
        - Тормозит / It is slow
        - Другое / Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Описание и шаги / Description and steps
      description: Что делал перед проблемой (персонаж, этаж, предмет, комната) и что ожидал увидеть / what you did, what you expected
      placeholder: |
        1. Начал забег за Isaac с модом ...
        2. Поднял предмет ...
        3. Игра вылетела
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Список модов / Mod list
      description: |
        Имена папок в `sd:/atmosphere/contents/010021C000B6A000/romfs/mods/` и откуда мод (ссылка на Workshop, версия). Если мод не из Workshop, приложи его папку архивом.
        Folder names in romfs/mods and where each mod comes from (Workshop link, version).
      placeholder: |
        eid (External Item Descriptions 4.x, https://steamcommunity.com/sharedfiles/filedetails/?id=836319872)
        mcm
    validations:
      required: true
  - type: textarea
    id: errors_log
    attributes:
      label: errors.log
      description: |
        Ошибки модов загрузчик пишет в сохранение игры, в файл `isaaclua/errors.log`. Достать его: закрой игру, в JKSV (или другом менеджере сохранений) сделай бэкап сохранения The Binding of Isaac и возьми из бэкапа `isaaclua/errors.log`. Файл пишется заново при каждом запуске игры, поэтому снимай его сразу после проблемы, не запуская игру снова.
        Mod errors go to `isaaclua/errors.log` inside the game's save data: close the game, back up its save with JKSV and take the file from the backup. It is rewritten at every launch, so take it right after the problem.
    validations:
      required: false
  - type: textarea
    id: crash
    attributes:
      label: Отчёт о вылете / Crash report
      description: |
        При вылете Atmosphere пишет отчёт в `sd:/atmosphere/crash_reports/`: приложи самый новый `.log` (по имени, в начале имени время). Если рядом есть папка `dumps` с тем же временем, она не нужна.
        On a crash Atmosphere writes `sd:/atmosphere/crash_reports/<time>_*.log`: attach the newest one.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Скриншоты, видео, isaaclua.ini / Screenshots, video, isaaclua.ini
      description: |
        Снимок экрана (кнопка захвата, потом из альбома) с ошибкой вверху, видео проблемы. Если менял `romfs/isaaclua.ini`, приложи его. Для тормозов: поставь `perf = 1` в `isaaclua.ini` и сделай снимок строки внизу экрана.
        A screenshot of the error, a video. Your isaaclua.ini if you changed it. For slowdowns: set `perf = 1` in isaaclua.ini and screenshot the line at the bottom.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Проверил / Checked
      options:
        - label: С выключенными остальными модами (только этот мод + его зависимости) проблема тоже есть / It also happens with the other mods turned off
          required: false
        - label: На ПК этот мод с тем же набором модов работает / The same mods work on PC
          required: false
