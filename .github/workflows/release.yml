name: release
# Publishes dist/isaaclua_v<version>.zip and dist/isaaclua_v<version>-repplus.zip (the build tested on the console) as a GitHub Release
# when dist/NOTES-v<version>.md or the zip is pushed to main (an existing release gets the new zip and notes).
on:
  push:
    branches: [main]
    paths: ['dist/NOTES-v*.md', 'dist/*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for n in dist/NOTES-v*.md; do
            v=${n#dist/NOTES-v}; v=${v%.md}
            tag=v$v
            test -f dist/isaaclua_v$v.zip
            files=
            for z in dist/isaaclua_v$v.zip dist/isaaclua_v$v-repplus.zip; do
              test -f "$z" || continue
              sha256sum "$z" | cut -d' ' -f1 > "$z.sha256"
              files="$files $z $z.sha256"
            done
            if gh release view "$tag" >/dev/null 2>&1; then
              if ! test -f dist/isaaclua_v$v-repplus.zip; then
                gh release delete-asset "$tag" isaaclua_v$v-repplus.zip -y || true
                gh release delete-asset "$tag" isaaclua_v$v-repplus.zip.sha256 -y || true
              fi
              gh release upload "$tag" $files --clobber
              gh release edit "$tag" --notes-file "$n"
              continue
            fi
            gh release create "$tag" $files --target "$GITHUB_SHA" --title "isaaclua $v" --notes-file "$n" --latest
          done
