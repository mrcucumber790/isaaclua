name: release
# Publishes dist/isaaclua_v<version>.zip (the build tested on the console) as a GitHub Release
# when dist/NOTES-v<version>.md is pushed to main.
on:
  push:
    branches: [main]
    paths: ['dist/NOTES-v*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for n in dist/NOTES-v*.md; do
            v=${n#dist/NOTES-v}; v=${v%.md}
            tag=v$v
            if gh release view "$tag" >/dev/null 2>&1; then echo "$tag exists"; continue; fi
            z=dist/isaaclua_v$v.zip
            test -f "$z"
            sha256sum "$z" | cut -d' ' -f1 > "$z.sha256"
            gh release create "$tag" "$z" "$z.sha256" --target "$GITHUB_SHA" --title "isaaclua $v" --notes-file "$n" --latest
          done
